name: Windows standalone release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify tag and source version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'tools'); from build_release import version; print(version())"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match source version' }
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -v
      - name: Check source publication contents
        run: python tools/release_check.py
      - name: Install build tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows x64 standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --noupx --name context_window --distpath dist/executable --workpath dist/build --specpath dist skills/context-window/scripts/context_window.py
      - name: Exercise standalone executable without Python on PATH
        run: python tools/smoke_executable.py dist/executable/context_window.exe
      - name: Package skill and executable
        run: python tools/build_release.py --executable dist/executable/context_window.exe
      - name: Attach verified assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release upload $env:RELEASE_TAG "dist/context-window-$version-windows-x64.zip" dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY
